<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>BLITZ — Draft Room</title>

<!-- Theme boots before first paint so dark mode never flashes white.
     No JavaScript → no data-theme → the :root defaults apply, which are
     the LIGHT theme. Light is the default on purpose. -->
<script>
try {
  var t = localStorage.getItem('blitz-theme')
  var dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'
  var m = document.createElement('meta')
  m.name = 'theme-color'; m.content = dark ? '#121316' : '#14B0D0'
  document.head.appendChild(m)
} catch (e) {}
</script>

<!-- installs to the home screen like a real app -->
<link rel="manifest" href="/blitz/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BLITZ">
<link rel="apple-touch-icon" href="/blitz/icon-180.png">
<link rel="icon" href="/blitz/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/blitz/sw.js', { scope: '/blitz/' }).catch(() => {})
    })
  }
</script>
</body>
</html>
